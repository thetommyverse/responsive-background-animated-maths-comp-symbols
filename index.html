<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive-Background-Code</title>

    <style>
        /* ==========================================================================
           VARIABLES & BASE STYLES
           ========================================================================== */
        :root {
            --color-purple: #6b21a8;
            --color-purple-dark: #4c1d95;
            --color-purple-light: #9333ea;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* ==========================================================================
           ANIMATED GRADIENT BACKGROUND
           ========================================================================== */
        .bg-animated-purple {
            background: linear-gradient(-45deg, var(--color-purple-dark), var(--color-purple), #3b0764, var(--color-purple-light));
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ==========================================================================
           CANVAS STYLES
           ========================================================================== */
        #hero-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<section class="bg-animated-purple">
    <canvas id="hero-canvas"></canvas>
</section>

<script>
    /* ==========================================================================
       PARTICLE SYSTEM
       ========================================================================== */
    const canvas = document.getElementById('hero-canvas');
    const ctx = canvas.getContext('2d');

    let width, height, particles;

    const symbols = ['{ }', 'Σ', 'π', '</>', '∫', 'ƒ(x)', 'λ', '0101', '∞', 'Δ', 'if()'];

    let mouse = { x: null, y: null };

    window.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
    });

    window.addEventListener('mouseout', () => {
        mouse.x = null;
        mouse.y = null;
    });

    function initCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                baseVx: (Math.random() - 0.5) * 0.5,
                baseVy: (Math.random() * -0.5) - 0.2,
                vx: 0,
                vy: 0,
                size: Math.random() * 20 + 15,
                symbol: symbols[Math.floor(Math.random() * symbols.length)],
                alpha: Math.random() * 0.2 + 0.05
            });
            particles[i].vx = particles[i].baseVx;
            particles[i].vy = particles[i].baseVy;
        }
    }


    function animateCanvas() {
        ctx.clearRect(0, 0, width, height);

        particles.forEach(p => {
            if (mouse.x != null && mouse.y != null) {
                let dx = p.x - mouse.x;
                let dy = p.y - mouse.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 120) {
                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    const force = (120 - distance) / 120;
                    p.vx += forceDirectionX * force * 0.5;
                    p.vy += forceDirectionY * force * 0.5;
                }
            }

            p.vx += (p.baseVx - p.vx) * 0.05;
            p.vy += (p.baseVy - p.vy) * 0.05;

            p.x += p.vx;
            p.y += p.vy;

            if (p.x < -50) p.x = width + 50;
            if (p.x > width + 50) p.x = -50;
            if (p.y < -50) p.y = height + 50;
            if (p.y > height + 50) p.y = -50;

            ctx.font = `800 ${p.size}px Poppins`;
            ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
            ctx.fillText(p.symbol, p.x, p.y);
        });

        requestAnimationFrame(animateCanvas);
    }

    window.addEventListener('resize', initCanvas);

    document.addEventListener("DOMContentLoaded", () => {
        initCanvas();
        animateCanvas();
    });
</script>
</body>
</html>
